<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161226"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c39bff"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".55"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>

  <g filter="url(#shadow)">
    <!-- record (soundtrack) -->
    <g transform="translate(400 250)">
      <circle r="120" fill="#1d2230" stroke="#3a4352" stroke-width="3"/>
      <circle r="92" fill="none" stroke="#2c3444" stroke-width="2"/>
      <circle r="68" fill="none" stroke="#2c3444" stroke-width="2"/>
      <circle r="38" fill="url(#violet)"/>
      <circle r="7" fill="#0d1117"/>
    </g>
    <!-- poster (movie) in the middle -->
    <g transform="translate(560 105)">
      <rect width="170" height="250" rx="14" fill="#2b3446" stroke="url(#violet)" stroke-width="4"/>
      <path d="M68 95 L118 125 L68 155 Z" fill="url(#violet)"/>
      <rect x="22" y="200" width="126" height="12" rx="6" fill="#f2f4f7" opacity=".8"/>
      <rect x="22" y="222" width="90" height="12" rx="6" fill="#f2f4f7" opacity=".45"/>
    </g>
    <!-- open book -->
    <g transform="translate(790 160)">
      <path d="M0 20 C40 0 90 0 130 20 L130 190 C90 170 40 170 0 190 Z" fill="#232a38" stroke="#3a4352" stroke-width="3"/>
      <path d="M130 20 C170 0 220 0 260 20 L260 190 C220 170 170 170 130 190 Z" fill="#283041" stroke="#3a4352" stroke-width="3"/>
      <g stroke="#f2f4f7" stroke-width="7" stroke-linecap="round" opacity=".55">
        <path d="M28 60 H104"/><path d="M28 90 H104"/><path d="M28 120 H86"/>
        <path d="M156 60 H232"/><path d="M156 90 H232"/><path d="M156 120 H214"/>
      </g>
    </g>
  </g>
  <!-- links between them -->
  <g fill="none" stroke="#a78bfa" stroke-width="6" stroke-dasharray="2 14" stroke-linecap="round" opacity=".9">
    <path d="M520 250 H556"/>
    <path d="M734 250 H786"/>
  </g>

  <text x="640" y="560" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif" font-weight="700" font-size="112" fill="#f2f4f7" letter-spacing="1">Companions</text>
</svg>
